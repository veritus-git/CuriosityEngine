<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="CuriosityEngine — Associative Knowledge & Curiosity Engine">
    <meta name="theme-color" content="#07070c">
    <title>CuriosityEngine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css?v=3.5.0">
</head>

<body>
    <div id="app">
        <!-- Top Fixed Global Progress Bar (Full Window Width) -->
        <div class="global-progress-bar" id="onboarding-global-progress" hidden>
            <div class="global-progress-fill" id="wizard-progress-fill"></div>
        </div>

        <!-- Ambient animated background -->
        <div class="ambient-bg" aria-hidden="true">
            <div class="ambient-orb ambient-orb--1"></div>
            <div class="ambient-orb ambient-orb--2"></div>
            <div class="ambient-focus-blur" id="ambient-focus-blur"></div>
        </div>

        <!-- Top Navigation Bar -->
        <header class="topbar" id="topbar">
            <div class="topbar__left">
                <a href="#" class="brand" id="nav-brand">
                    <img src="assets/logo.png" alt="CuriosityEngine" class="brand__logo-img">
                    <span class="brand__name" data-i18n="nav.brand">CuriosityEngine</span>
                </a>
                <span class="topbar__date" id="topbar-date"></span>
            </div>

            <nav class="topbar__nav">
                <!-- Nav links (Only shown when authenticated on dashboard/constellation/history) -->
                <div class="topbar__nav-links" id="topbar-nav-links" hidden>
                    <button class="topbar__btn" id="btn-nav-sparks" aria-label="Spark Inbox" title="Spark Inbox">
                        <span class="topbar__label" id="nav-sparks-label" data-i18n="nav.sparks"></span>
                    </button>
                    <button class="topbar__btn" id="btn-nav-constellation" aria-label="Constellation"
                        title="Knowledge Constellation">
                        <span class="topbar__label" data-i18n="nav.constellation"></span>
                    </button>
                    <button class="topbar__btn" id="btn-nav-history" aria-label="History" title="History">
                        <span class="topbar__label" data-i18n="nav.history"></span>
                    </button>
                </div>

                <!-- Unauthenticated Auth Links (Shown on Landing Page when logged out) -->
                <div class="topbar__auth-links" id="topbar-auth-links">
                    <button class="topbar__btn topbar__btn--auth-login" id="btn-topbar-login"
                        data-i18n="nav.login_btn"></button>
                    <button class="topbar__btn topbar__btn--auth-register" id="btn-topbar-register"
                        data-i18n="nav.register_btn"></button>
                </div>

                <!-- Authenticated User Avatar & Dropdown Menu -->
                <div class="topbar__user-profile" id="topbar-user-profile" hidden>
                    <button type="button" class="user-avatar-btn" id="btn-user-avatar" aria-label="User Menu"
                        aria-expanded="false">
                        <span class="user-avatar-initial" id="user-avatar-initial">U</span>
                    </button>
                    <div class="user-dropdown-menu" id="user-dropdown-menu" hidden>
                        <div class="user-dropdown-header">
                            <span class="user-dropdown-name" id="user-dropdown-name">User</span>
                        </div>
                        <div class="user-dropdown-divider"></div>
                        <button type="button" class="user-dropdown-item" id="btn-user-menu-dashboard"
                            data-i18n="nav.user_dashboard"></button>
                        <button type="button" class="user-dropdown-item" id="btn-user-menu-settings"
                            data-i18n="nav.user_settings"></button>
                        <div class="user-dropdown-divider"></div>
                        <button type="button" class="user-dropdown-item user-dropdown-item--danger"
                            id="btn-user-menu-logout" data-i18n="nav.user_logout"></button>
                    </div>
                </div>

                <!-- Language Selector (ONLY visible on Landing Page when NOT logged in) -->
                <select id="topbar-lang-select" class="lang-select" aria-label="Language">
                </select>
            </nav>
        </header>

        <!-- Main Workspace -->
        <main class="main" id="main">

            <!-- 1. LANDING PAGE VIEW (SaaS Style with Dynamic Headlines) -->
            <section class="view view--landing" id="view-landing" aria-label="CuriosityEngine Landing">
                <div class="landing-hero">
                    <h1 class="landing-hero-title">
                        <span data-i18n="landing.title_static"></span><br>
                        <span class="hero-dynamic-text-wrap">
                            <span class="hero-dynamic-text" id="hero-dynamic-text"></span>
                            <span class="hero-cursor" aria-hidden="true">|</span>
                        </span>
                    </h1>

                    <div class="landing-cta-group">
                        <p class="landing-hero-subtitle" data-i18n="landing.subtitle"></p>
                        <a href="#landing-features" class="btn btn--ghost btn--lg landing-how-btn" id="btn-landing-how"
                            data-i18n="landing.cta_how"></a>
                        <button type="button" class="btn btn--primary btn--lg landing-cta-btn" id="btn-landing-cta"
                            data-i18n="landing.cta_start"></button>
                    </div>
                    
                </div>

                <!-- Features Showcase Section -->
                <div class="landing-features" id="landing-features">
                    <div class="landing-features-header">
                        <span class="badge" data-i18n="landing.features_badge"></span>
                        <h2 class="landing-section-title" data-i18n="landing.features_title"></h2>
                        <p class="landing-section-subtitle" data-i18n="landing.features_subtitle"></p>
                    </div>

                    <div class="landing-features-grid">
                        <div class="feature-card">
                            <span class="feature-card__tag" data-i18n="landing.f1_tag"></span>
                            <h3 class="feature-card__title" data-i18n="landing.f1_title"></h3>
                            <p class="feature-card__desc" data-i18n="landing.f1_desc"></p>
                        </div>
                        <div class="feature-card">
                            <span class="feature-card__tag" data-i18n="landing.f2_tag"></span>
                            <h3 class="feature-card__title" data-i18n="landing.f2_title"></h3>
                            <p class="feature-card__desc" data-i18n="landing.f2_desc"></p>
                        </div>
                        <div class="feature-card">
                            <span class="feature-card__tag" data-i18n="landing.f3_tag"></span>
                            <h3 class="feature-card__title" data-i18n="landing.f3_title"></h3>
                            <p class="feature-card__desc" data-i18n="landing.f3_desc"></p>
                        </div>
                        <div class="feature-card">
                            <span class="feature-card__tag" data-i18n="landing.f4_tag"></span>
                            <h3 class="feature-card__title" data-i18n="landing.f4_title"></h3>
                            <p class="feature-card__desc" data-i18n="landing.f4_desc"></p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. AUTH MODAL (LOGIN / REGISTER / FIRST ADMIN SETUP) -->
            <div class="auth-modal-backdrop" id="auth-modal-backdrop" hidden>
                <div class="auth-card">
                    <button type="button" class="modal-close auth-modal-close" id="btn-close-auth-modal"
                        aria-label="Close">&times;</button>
                    <div class="auth-hero">
                        <img src="assets/logo.png" alt="CuriosityEngine" class="auth-hero-img">
                        <h2 class="auth-title" id="auth-card-title" data-i18n="auth.login_title"></h2>
                        <p class="auth-subtitle" id="auth-card-subtitle" data-i18n="auth.login_subtitle"></p>
                    </div>
                    <form id="auth-form" class="auth-form">
                        <div class="field">
                            <label class="field__label" for="auth-username" data-i18n="auth.username"></label>
                            <input type="text" class="input" id="auth-username" required autocomplete="username">
                        </div>
                        <div class="field">
                            <label class="field__label" for="auth-password" data-i18n="auth.password"></label>
                            <input type="password" class="input" id="auth-password" required
                                autocomplete="current-password">
                        </div>
                        <p id="auth-error" class="form-error" style="display: none;"></p>
                        <div class="auth-actions">
                            <button type="submit" class="btn btn--primary btn--full" id="btn-login-submit">
                                <span class="btn__text" id="auth-submit-text" data-i18n="auth.login_submit"></span>
                                <span class="btn__loader" aria-hidden="true"></span>
                            </button>
                        </div>
                        <div class="auth-switch-box">
                            <button type="button" class="btn-link" id="btn-auth-switch"
                                data-i18n="auth.switch_to_register"></button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 3. ONBOARDING VIEW (4-STEP SLIDE WIZARD) -->
            <section class="view view--onboarding" id="view-onboarding" hidden aria-label="Onboarding Wizard">
                <div class="view__content onboarding-container">

                    <!-- Slide Card Container -->
                    <div class="wizard-card">                        <!-- SLIDE 0: LANGUAGE & PERSONALIZATION / FORM OF ADDRESS -->
                        <div class="wizard-slide" id="wizard-slide-0">
                            <div class="wizard-slide__content">
                                <div class="slide-header">
                                    <h2 class="slide-title" data-i18n="onboarding.step0_title"></h2>
                                    <p class="slide-subtitle" data-i18n="onboarding.step0_subtitle"></p>
                                </div>

                                <div class="slide-content-spacious">
                                    <div class="step0-section">
                                        <span class="step0-label" data-i18n="onboarding.step0_lang_label"></span>
                                        <div class="step0-lang-pills" id="onboarding-lang-pills">
                                            <button type="button" class="lang-pill" data-lang="en">English</button>
                                            <button type="button" class="lang-pill active" data-lang="pl">Polski</button>
                                        </div>
                                    </div>

                                    <div class="step0-section">
                                        <span class="step0-label" data-i18n="onboarding.step0_address_label"></span>
                                        <div class="step0-gender-grid" id="onboarding-gender-grid">
                                            <button type="button" class="gender-pill active" data-gender="male">
                                                <span data-i18n="onboarding.gender_male"></span>
                                            </button>
                                            <button type="button" class="gender-pill" data-gender="female">
                                                <span data-i18n="onboarding.gender_female"></span>
                                            </button>
                                            <button type="button" class="gender-pill" data-gender="neutral">
                                                <span data-i18n="onboarding.gender_neutral"></span>
                                            </button>
                                            <button type="button" class="gender-pill" data-gender="custom">
                                                <span data-i18n="onboarding.gender_custom"></span>
                                            </button>
                                        </div>
                                        <div class="step0-custom-input-wrap" id="step0-custom-gender-wrap"
                                            style="display: none;">
                                            <input type="text" class="input input--compact" id="input-custom-gender"
                                                data-i18n-placeholder="onboarding.gender_custom_placeholder">
                                        </div>
                                    </div>

                                    <p class="step0-disclaimer" data-i18n="onboarding.step0_disclaimer"></p>
                                </div>
                            </div>

                            <div class="wizard-actions wizard-actions--step0">
                                <button type="button" class="btn btn--primary btn--step-next" id="btn-wizard-step0-next"
                                    data-i18n="onboarding.btn_next"></button>
                            </div>
                        </div>

                        <!-- SLIDE 1: DOMAINS & PASSIONS -->
                        <div class="wizard-slide" id="wizard-slide-1" hidden>
                            <div class="wizard-slide__content">
                                <div class="slide-header">
                                    <h2 class="slide-title" data-i18n="onboarding.step1_title"></h2>
                                    <p class="slide-subtitle" data-i18n="onboarding.step1_subtitle"></p>
                                </div>

                                <div class="chips-column" id="onboarding-domains-chips">
                                    <!-- 1. Matematyka -->
                                    <button type="button" class="chip-row" data-domain="math">
                                        <div class="chip-row__bg" aria-hidden="true">
                                            <svg class="chip-bg-icon pos-1" viewBox="0 0 24 24"><path d="M4 18l4-12 4 14 3-8h5"/></svg>
                                            <svg class="chip-bg-icon pos-2" viewBox="0 0 24 24"><path d="M4 7h16M7 7v10M17 7v10"/></svg>
                                            <svg class="chip-bg-icon pos-3" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
                                            <svg class="chip-bg-icon pos-4" viewBox="0 0 24 24"><path d="M6 18c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6-6-2.7-6-6zM18 18c0-3.3-2.7-6-6-6"/></svg>
                                        </div>
                                        <div class="chip-row__content">
                                            <svg class="chip-row__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M4 17l4-10 4 14 3-7h5"></path>
                                            </svg>
                                            <span class="chip-row__label" data-i18n="onboarding.domains.math"></span>
                                        </div>
                                    </button>

                                    <!-- 2. Informatyka -->
                                    <button type="button" class="chip-row" data-domain="cs">
                                        <div class="chip-row__bg" aria-hidden="true">
                                            <svg class="chip-bg-icon pos-1" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                                            <svg class="chip-bg-icon pos-2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
                                            <svg class="chip-bg-icon pos-3" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                                            <svg class="chip-bg-icon pos-4" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                                        </div>
                                        <div class="chip-row__content">
                                            <svg class="chip-row__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <polyline points="16 18 22 12 16 6"></polyline>
                                                <polyline points="8 6 2 12 8 18"></polyline>
                                            </svg>
                                            <span class="chip-row__label" data-i18n="onboarding.domains.cs"></span>
                                        </div>
                                    </button>

                                    <!-- 3. Fizyka -->
                                    <button type="button" class="chip-row" data-domain="physics">
                                        <div class="chip-row__bg" aria-hidden="true">
                                            <svg class="chip-bg-icon pos-1" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(30 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(-30 12 12)"/></svg>
                                            <svg class="chip-bg-icon pos-2" viewBox="0 0 24 24"><path d="M2 12c3-4 6-4 9 0s6 4 9 0"/><circle cx="12" cy="12" r="2"/></svg>
                                            <svg class="chip-bg-icon pos-3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>
                                            <svg class="chip-bg-icon pos-4" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4"/></svg>
                                        </div>
                                        <div class="chip-row__content">
                                            <svg class="chip-row__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="12" cy="12" r="2"></circle>
                                                <ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(30 12 12)"></ellipse>
                                                <ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(-30 12 12)"></ellipse>
                                            </svg>
                                            <span class="chip-row__label" data-i18n="onboarding.domains.physics"></span>
                                        </div>
                                    </button>

                                    <!-- 4. Biologia -->
                                    <button type="button" class="chip-row" data-domain="biology">
                                        <div class="chip-row__bg" aria-hidden="true">
                                            <svg class="chip-bg-icon pos-1" viewBox="0 0 24 24"><path d="M2 15c6.6-6 13.3 0 20-6M2 9c6.6 6 13.3 0 20 6"/></svg>
                                            <svg class="chip-bg-icon pos-2" viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 1 9 9c0 5-4 9-9 9s-9-4-9-9a9 9 0 0 1 9-9z"/><path d="M12 2v20"/></svg>
                                            <svg class="chip-bg-icon pos-3" viewBox="0 0 24 24"><path d="M4 18l3 3M17 6l3-3M9 22c1.8-2 2.5-4 2.8-6M15 2c-1.8 2-2.5 4-2.8 6"/></svg>
                                            <svg class="chip-bg-icon pos-4" viewBox="0 0 24 24"><path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/></svg>
                                        </div>
                                        <div class="chip-row__content">
                                            <svg class="chip-row__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M2 15c6.6-6 13.3 0 20-6"></path>
                                                <path d="M9 22c1.8-2 2.5-4 2.8-6"></path>
                                                <path d="M15 2c-1.8 2-2.5 4-2.8 6"></path>
                                                <path d="M17 6l3-3"></path>
                                                <path d="M4 18l3 3"></path>
                                                <path d="M12 12l2-2"></path>
                                            </svg>
                                            <span class="chip-row__label" data-i18n="onboarding.domains.biology"></span>
                                        </div>
                                    </button>

                                    <!-- 5. Inżynieria -->
                                    <button type="button" class="chip-row" data-domain="engineering">
                                        <div class="chip-row__bg" aria-hidden="true">
                                            <svg class="chip-bg-icon pos-1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                                            <svg class="chip-bg-icon pos-2" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                                            <svg class="chip-bg-icon pos-3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
                                            <svg class="chip-bg-icon pos-4" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                                        </div>
                                        <div class="chip-row__content">
                                            <svg class="chip-row__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="12" cy="12" r="3"></circle>
                                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                            </svg>
                                            <span class="chip-row__label" data-i18n="onboarding.domains.engineering"></span>
                                        </div>
                                    </button>

                                    <!-- 6. Psychologia -->
                                    <button type="button" class="chip-row" data-domain="psychology">
                                        <div class="chip-row__bg" aria-hidden="true">
                                            <svg class="chip-bg-icon pos-1" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04z"/></svg>
                                            <svg class="chip-bg-icon pos-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
                                            <svg class="chip-bg-icon pos-3" viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8c0 3.4 2.1 6.3 5 7.4V20a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2.6c2.9-1.1 5-4 5-7.4a8 8 0 0 0-8-8z"/></svg>
                                            <svg class="chip-bg-icon pos-4" viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 3-2 5.5 2.5 0 4.24-.5 5.5-2"/></svg>
                                        </div>
                                        <div class="chip-row__content">

                            </div>

                            <!-- Normal Page Flow with Scroll Transition Spacer -->
                            <div class="focus-scroll-spacer" id="focus-scroll-spacer"></div>

                            <!-- Normal Reading Header (Destination State) -->
                            <header class="focus-normal-header" id="focus-normal-header">
                                <span class="focus-normal-domain" id="focus-normal-domain"></span>
                                <h1 class="focus-normal-title" id="focus-normal-title"></h1>
                                <p class="focus-bridge-subtitle" id="focus-concept-reason"></p>
                            </header>

                            <!-- Borderless Fluid Markdown Document -->
                            <article class="focus-article" id="focus-concept-model"></article>

                            <!-- Follow-up Prompt Section -->
                            <div class="focus-prompt-section">
                                <p class="focus-prompt-intro" data-i18n="focus_card.prompt_intro_text"></p>

                                <!-- Neutral Graphite Prompt Card with Distinct Top Bar -->
                                <div class="prompt-card-graphite" id="prompt-surface">
                                    <div class="prompt-card__header">
                                        <div class="prompt-card__tag-wrap">
                                            <span class="prompt-topbar-dot" aria-hidden="true"></span>
                                            <span class="prompt-topbar-tag" data-i18n="focus_card.prompt_header_label">AI Prompt</span>
                                        </div>
                                        <div class="prompt-card__actions">
                                            <span class="copy-feedback-toast" id="copy-feedback-toast"
                                                data-i18n="focus_card.prompt_copied" style="display: none;"></span>
                                            <button type="button" class="btn-copy-graphite" id="btn-copy-prompt"
                                                data-i18n-title="focus_card.copy_prompt_tooltip" aria-label="Copy prompt">
                                                <svg class="copy-icon-svg" viewBox="0 0 24 24" width="13" height="13"
                                                    fill="none" stroke="currentColor" stroke-width="2"
                                                    stroke-linecap="round" stroke-linejoin="round">
                                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                                </svg>
                                                <span data-i18n="focus_card.copy_prompt_tooltip"></span>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="prompt-card__body">
                                        <p class="prompt-card__content" id="prompt-card-content"></p>
                                    </div>
                                </div>

                                <!-- Centered External Launchers (Hanging under the card on background) -->
                                <div class="prompt-external-launchers">
                                    <button type="button" class="launcher-btn" id="btn-launch-chatgpt"
                                        data-target="chatgpt">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2">
                                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                                            <polyline points="15 3 21 3 21 9" />
                                            <line x1="10" y1="14" x2="21" y2="3" />
                                        </svg>
                                        <span data-i18n="focus_card.launch_chatgpt"></span>
                                    </button>
                                    <button type="button" class="launcher-btn" id="btn-launch-claude"
                                        data-target="claude">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2">
                                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                                            <polyline points="15 3 21 3 21 9" />
                                            <line x1="10" y1="14" x2="21" y2="3" />
                                        </svg>
                                        <span data-i18n="focus_card.launch_claude"></span>
                                    </button>
                                    <button type="button" class="launcher-btn" id="btn-launch-gemini"
                                        data-target="gemini">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2">
                                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                                            <polyline points="15 3 21 3 21 9" />
                                            <line x1="10" y1="14" x2="21" y2="3" />
                                        </svg>
                                        <span data-i18n="focus_card.launch_gemini"></span>
                                    </button>
                                </div>
                            </div>

                            <!-- Fluid Session Action Dock -->
                            <div class="focus-dock-actions">
                                <button type="button" class="btn btn--primary btn--lg btn--finish-glow"
                                    id="btn-focus-finish">
                                    <span class="icon">✓</span>
                                    <span class="btn__text" data-i18n="focus_card.finish_btn"></span>
                                </button>
                                <button type="button" class="btn-text-abandon" id="btn-focus-abandon">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                    <span data-i18n="focus_card.abandon_btn"></span>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- 6. KNOWLEDGE CONSTELLATION VIEW -->
            <section class="view view--constellation" id="view-constellation" hidden
                aria-label="Knowledge Constellation">
                <div class="constellation-header">
                    <div>
                        <h1 class="page-title" data-i18n="constellation.title"></h1>
                        <p class="page-subtitle" id="constellation-subtitle" data-i18n="constellation.subtitle"></p>
                    </div>
                    <button class="btn btn--ghost btn--small" id="btn-constellation-back"
                        data-i18n="constellation.back_btn"></button>
                </div>
                <div class="canvas-container">
                    <canvas id="constellation-canvas"></canvas>
                    <div class="constellation-empty" id="constellation-empty" hidden>
                        <p data-i18n="constellation.empty"></p>
                    </div>
                </div>
            </section>

            <!-- 6. HISTORY ARCHIVE VIEW -->
            <section class="view view--history" id="view-history" hidden aria-label="History Archive">
                <div class="view__content view__content--wide">
                    <div class="history-header">
                        <h1 class="page-title" data-i18n="history.title"></h1>
                        <button class="btn btn--ghost btn--small" id="btn-history-back"
                            data-i18n="history.back_btn"></button>
                    </div>
                    <div class="history-list" id="history-list"></div>
                    <p class="history-empty" id="history-empty" hidden data-i18n="history.empty"></p>
                </div>
            </section>

            <!-- 7. SETTINGS VIEW -->
            <section class="view view--settings" id="view-settings" hidden aria-label="Settings">
                <div class="view__content view__content--wide">
                    <div class="history-header">
                        <h2 class="history-title" data-i18n="settings.title"></h2>
                        <button class="btn btn--ghost btn--small" id="btn-settings-back"
                            data-i18n="settings.back_btn"></button>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-heading" data-i18n="settings.ai_heading"></h3>
                        <div class="settings-info" id="settings-ai-info"></div>
                        <p class="settings-hint" data-i18n="settings.ai_hint"></p>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-heading" data-i18n="settings.language_heading"></h3>
                        <p class="settings-hint" data-i18n="settings.language_hint"></p>
                        <select class="input" id="select-settings-language"></select>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-heading" data-i18n="settings.address_heading"></h3>
                        <p class="settings-hint" data-i18n="settings.address_hint"></p>
                        <select class="input" id="select-settings-address">
                            <option value="neutral">Nijaka / Neutralna (Bezosobowo)</option>
                            <option value="ty">Forma bezpośrednia ("Ty / Odkryłeś")</option>
                            <option value="pan_pani">Forma oficjalna ("Pan / Pani")</option>
                        </select>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-heading" data-i18n="settings.profile_heading"></h3>
                        <p class="settings-hint" data-i18n="settings.profile_hint"></p>
                        <select class="input" id="select-settings-level">
                            <option value="ground_zero">Od Zera / Intuicja (Proste analogie z życia)</option>
                            <option value="builder">Builder / Systemy (Łączenie kropek & mechanizmy)</option>
                            <option value="deep">Pod Maską / Ekspert (Pierwsze zasady & dekonstrukcja)</option>
                        </select>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-heading" data-i18n="settings.privacy_heading"></h3>
                        <p class="settings-hint" data-i18n="settings.privacy_text"></p>
                    </div>
                </div>
            </section>

        </main>

        <!-- Quick Spark Modal / Drawer -->
        <div class="modal-backdrop" id="spark-modal-backdrop" hidden>
            <div class="modal-drawer">
                <div class="modal-header">
                    <h2 class="modal-title" data-i18n="spark_box.title"></h2>
                    <button class="modal-close" id="btn-close-spark-modal">&times;</button>
                </div>
                <p class="modal-subtitle" data-i18n="spark_box.subtitle"></p>
                <div class="input-group">
                    <input type="text" class="input" id="input-spark-text"
                        data-i18n-placeholder="spark_box.input_placeholder">
                    <button class="btn btn--primary" id="btn-submit-spark" data-i18n="spark_box.add_btn"></button>
                </div>
                <div class="sparks-list" id="sparks-inbox-list"></div>
            </div>
        </div>

        <!-- Multi-Concept Complete Session Modal -->
        <div class="modal-backdrop" id="complete-modal-backdrop" hidden>
            <div class="modal-card">
                <div class="modal-header">
                    <h2 class="modal-title" data-i18n="complete_modal.title"></h2>
                    <button class="modal-close" id="btn-close-complete-modal">&times;</button>
                </div>
                <p class="modal-subtitle" id="complete-modal-subtitle"></p>
                <form id="complete-session-form" class="modal-form">
                    <div class="field">
                        <label class="field__label" for="input-coexplored"
                            data-i18n="complete_modal.co_explored_label"></label>
                        <textarea class="textarea" id="input-coexplored" rows="3"
                            data-i18n-placeholder="complete_modal.co_explored_placeholder"></textarea>
                        <span class="field__hint" data-i18n="complete_modal.co_explored_hint"></span>
                    </div>
                    <div class="field">
                        <label class="field__label" for="input-notes" data-i18n="complete_modal.notes_label"></label>
                        <input type="text" class="input" id="input-notes"
                            data-i18n-placeholder="complete_modal.notes_placeholder">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn--ghost" id="btn-cancel-complete"
                            data-i18n="complete_modal.cancel_btn"></button>
                        <button type="submit" class="btn btn--primary" id="btn-confirm-complete">
                            <span class="btn__text" data-i18n="complete_modal.save_btn"></span>
                            <span class="btn__loader" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Floating Quick Spark Trigger Button (Mobile & Desktop) -->
        <button class="floating-spark-btn" id="btn-floating-spark" hidden aria-label="Schowek na nagłe myśli"
            title="Schowek na nagłe myśli (Spacja)">
            <svg class="floating-spark-svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" />
                <circle cx="12" cy="12" r="2.2" fill="#ffffff" />
            </svg>
        </button>

        <!-- Global Zen Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay" hidden aria-live="polite">
            <div class="loading-content">
                <img src="assets/logo.png" alt="Loading" class="loading-logo-spin" width="52" height="52"
                    style="width: 52px; height: 52px; max-width: 52px; max-height: 52px;">
                <p class="loading-text" id="loading-text" data-i18n="loading.generating"></p>
            </div>
        </div>

        <!-- Notification Toast -->
        <div class="toast" id="toast" hidden role="alert">
            <span class="toast__icon">✓</span>
            <p class="toast__text" id="toast-text"></p>
        </div>
    </div>

    <script src="app.js?v=3.5.0"></script>
</body>

</html>
