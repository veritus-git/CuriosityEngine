<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="CuriosityEngine — Associative Knowledge & Curiosity Engine">
    <meta name="theme-color" content="#07070c">
    <title>CuriosityEngine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css?v=2.1">
</head>

<body>
    <div id="app">
        <!-- Top Fixed Global Progress Bar (Full Window Width) -->
        <div class="global-progress-bar" id="onboarding-global-progress" hidden>
            <div class="global-progress-fill" id="wizard-progress-fill"></div>
        </div>

        <!-- Ambient animated background -->
        <div class="ambient-bg" aria-hidden="true">
            <div class="ambient-orb ambient-orb--1"></div>
            <div class="ambient-orb ambient-orb--2"></div>
        </div>

        <!-- Top Navigation Bar -->
        <header class="topbar" id="topbar">
            <div class="topbar__left">
                <a href="#" class="brand" id="nav-brand">
                    <img src="assets/logo.png" alt="CuriosityEngine" class="brand__logo-img">
                    <span class="brand__name" data-i18n="nav.brand">CuriosityEngine</span>
                </a>
                <span class="topbar__date" id="topbar-date"></span>
            </div>

            <nav class="topbar__nav">
                <!-- Nav links (Only shown when authenticated on dashboard/constellation/history) -->
                <div class="topbar__nav-links" id="topbar-nav-links" hidden>
                    <button class="topbar__btn" id="btn-nav-sparks" aria-label="Spark Inbox" title="Spark Inbox">
                        <span class="topbar__label" id="nav-sparks-label" data-i18n="nav.sparks"></span>
                    </button>
                    <button class="topbar__btn" id="btn-nav-constellation" aria-label="Constellation"
                        title="Knowledge Constellation">
                        <span class="topbar__label" data-i18n="nav.constellation"></span>
                    </button>
                    <button class="topbar__btn" id="btn-nav-history" aria-label="History" title="History">
                        <span class="topbar__label" data-i18n="nav.history"></span>
                    </button>
                </div>

                <!-- Unauthenticated Auth Links (Shown on Landing Page when logged out) -->
                <div class="topbar__auth-links" id="topbar-auth-links">
                    <button class="topbar__btn topbar__btn--auth-login" id="btn-topbar-login" data-i18n="nav.login_btn"></button>
                    <button class="topbar__btn topbar__btn--auth-register" id="btn-topbar-register" data-i18n="nav.register_btn"></button>
                </div>

                <!-- Authenticated User Avatar & Dropdown Menu -->
                <div class="topbar__user-profile" id="topbar-user-profile" hidden>
                    <button type="button" class="user-avatar-btn" id="btn-user-avatar" aria-label="User Menu" aria-expanded="false">
                        <span class="user-avatar-initial" id="user-avatar-initial">U</span>
                    </button>
                    <div class="user-dropdown-menu" id="user-dropdown-menu" hidden>
                        <div class="user-dropdown-header">
                            <span class="user-dropdown-name" id="user-dropdown-name">User</span>
                        </div>
                        <div class="user-dropdown-divider"></div>
                        <button type="button" class="user-dropdown-item" id="btn-user-menu-dashboard" data-i18n="nav.user_dashboard"></button>
                        <button type="button" class="user-dropdown-item" id="btn-user-menu-settings" data-i18n="nav.user_settings"></button>
                        <div class="user-dropdown-divider"></div>
                        <button type="button" class="user-dropdown-item user-dropdown-item--danger" id="btn-user-menu-logout" data-i18n="nav.user_logout"></button>
                    </div>
                </div>

                <!-- Language Selector (ONLY visible on Landing Page when NOT logged in) -->
                <select id="topbar-lang-select" class="lang-select" aria-label="Language">
                </select>
            </nav>
        </header>

        <!-- Main Workspace -->
        <main class="main" id="main">

            <!-- 1. LANDING PAGE VIEW (SaaS Style with Dynamic Headlines) -->
            <section class="view view--landing" id="view-landing" aria-label="CuriosityEngine Landing">
                <div class="landing-hero">
                    <h1 class="landing-hero-title">
                        <span data-i18n="landing.title_static"></span><br>
                        <span class="hero-dynamic-text-wrap">
                            <span class="hero-dynamic-text" id="hero-dynamic-text"></span>
                            <span class="hero-cursor" aria-hidden="true">|</span>
                        </span>
                    </h1>
                    <p class="landing-hero-subtitle" data-i18n="landing.subtitle"></p>
                    <div class="landing-cta-group">
                        <button type="button" class="btn btn--primary btn--lg landing-cta-btn" id="btn-landing-cta" data-i18n="landing.cta_start"></button>
                        <a href="#landing-features" class="btn btn--ghost btn--lg landing-how-btn" id="btn-landing-how" data-i18n="landing.cta_how"></a>
                    </div>
                </div>

                <!-- Features Showcase Section -->
                <div class="landing-features" id="landing-features">
                    <div class="landing-features-header">
                        <span class="badge" data-i18n="landing.features_badge"></span>
                        <h2 class="landing-section-title" data-i18n="landing.features_title"></h2>
                        <p class="landing-section-subtitle" data-i18n="landing.features_subtitle"></p>
                    </div>

                    <div class="landing-features-grid">
                        <div class="feature-card">
                            <span class="feature-card__tag" data-i18n="landing.f1_tag"></span>
                            <h3 class="feature-card__title" data-i18n="landing.f1_title"></h3>
                            <p class="feature-card__desc" data-i18n="landing.f1_desc"></p>
                        </div>
                        <div class="feature-card">
                            <span class="feature-card__tag" data-i18n="landing.f2_tag"></span>
                            <h3 class="feature-card__title" data-i18n="landing.f2_title"></h3>
                            <p class="feature-card__desc" data-i18n="landing.f2_desc"></p>
                        </div>
                        <div class="feature-card">
                            <span class="feature-card__tag" data-i18n="landing.f3_tag"></span>
                            <h3 class="feature-card__title" data-i18n="landing.f3_title"></h3>
                            <p class="feature-card__desc" data-i18n="landing.f3_desc"></p>
                        </div>
                        <div class="feature-card">
                            <span class="feature-card__tag" data-i18n="landing.f4_tag"></span>
                            <h3 class="feature-card__title" data-i18n="landing.f4_title"></h3>
                            <p class="feature-card__desc" data-i18n="landing.f4_desc"></p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. AUTH MODAL (LOGIN / REGISTER / FIRST ADMIN SETUP) -->
            <div class="auth-modal-backdrop" id="auth-modal-backdrop" hidden>
                <div class="auth-card">
                    <button type="button" class="modal-close auth-modal-close" id="btn-close-auth-modal" aria-label="Close">&times;</button>
                    <div class="auth-hero">
                        <img src="assets/logo.png" alt="CuriosityEngine" class="auth-hero-img">
                        <h2 class="auth-title" id="auth-card-title" data-i18n="auth.login_title"></h2>
                        <p class="auth-subtitle" id="auth-card-subtitle" data-i18n="auth.login_subtitle"></p>
                    </div>
                    <form id="auth-form" class="auth-form">
                        <div class="field">
                            <label class="field__label" for="auth-username" data-i18n="auth.username"></label>
                            <input type="text" class="input" id="auth-username" required autocomplete="username">
                        </div>
                        <div class="field">
                            <label class="field__label" for="auth-password" data-i18n="auth.password"></label>
                            <input type="password" class="input" id="auth-password" required
                                autocomplete="current-password">
                        </div>
                        <p id="auth-error" class="form-error" style="display: none;"></p>
                        <div class="auth-actions">
                            <button type="submit" class="btn btn--primary btn--full" id="btn-login-submit">
                                <span class="btn__text" id="auth-submit-text" data-i18n="auth.login_submit"></span>
                                <span class="btn__loader" aria-hidden="true"></span>
                            </button>
                        </div>
                        <div class="auth-switch-box">
                            <button type="button" class="btn-link" id="btn-auth-switch" data-i18n="auth.switch_to_register"></button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 3. ONBOARDING VIEW (4-STEP SLIDE WIZARD) -->
            <section class="view view--onboarding" id="view-onboarding" hidden aria-label="Onboarding Wizard">
                <div class="view__content onboarding-container">

                    <!-- Slide Card Container -->
                    <div class="wizard-card">

                        <!-- SLIDE 0: LANGUAGE & PERSONALIZATION / FORM OF ADDRESS -->
                        <div class="wizard-slide" id="wizard-slide-0">
                            <div class="slide-header">
                                <h2 class="slide-title" data-i18n="onboarding.step0_title"></h2>
                                <p class="slide-subtitle" data-i18n="onboarding.step0_subtitle"></p>
                            </div>

                            <div class="slide-content-spacious">
                                <div class="step0-section">
                                    <span class="step0-label" data-i18n="onboarding.step0_lang_label"></span>
                                    <div class="step0-lang-pills" id="onboarding-lang-pills">
                                        <button type="button" class="lang-pill" data-lang="en">🇬🇧 English</button>
                                        <button type="button" class="lang-pill active" data-lang="pl">🇵🇱 Polski</button>
                                    </div>
                                </div>

                                <div class="step0-section">
                                    <span class="step0-label" data-i18n="onboarding.step0_address_label"></span>
                                    <div class="step0-gender-grid" id="onboarding-gender-grid">
                                        <button type="button" class="gender-pill active" data-gender="male">
                                            <span data-i18n="onboarding.gender_male"></span>
                                        </button>
                                        <button type="button" class="gender-pill" data-gender="female">
                                            <span data-i18n="onboarding.gender_female"></span>
                                        </button>
                                        <button type="button" class="gender-pill" data-gender="neutral">
                                            <span data-i18n="onboarding.gender_neutral"></span>
                                        </button>
                                        <button type="button" class="gender-pill" data-gender="custom">
                                            <span data-i18n="onboarding.gender_custom"></span>
                                        </button>
                                    </div>
                                    <div class="step0-custom-input-wrap" id="step0-custom-gender-wrap" style="display: none;">
                                        <input type="text" class="input input--compact" id="input-custom-gender"
                                            data-i18n-placeholder="onboarding.gender_custom_placeholder">
                                    </div>
                                </div>

                                <p class="step0-disclaimer" data-i18n="onboarding.step0_disclaimer"></p>
                            </div>

                            <div class="wizard-actions wizard-actions--step1">
                                <button type="button" class="btn btn--primary btn--step-next" id="btn-wizard-step0-next"
                                    data-i18n="onboarding.btn_next"></button>
                            </div>
                        </div>

                        <!-- SLIDE 1: DOMAINS & PASSIONS -->
                        <div class="wizard-slide" id="wizard-slide-1" hidden>
                            <div class="slide-header">
                                <h2 class="slide-title" data-i18n="onboarding.step1_title"></h2>
                                <p class="slide-subtitle" data-i18n="onboarding.step1_subtitle"></p>
                            </div>

                            <div class="chips-column" id="onboarding-domains-chips">
                                <button type="button" class="chip-row" data-domain="math"
                                    data-i18n="onboarding.domains.math"></button>
                                <button type="button" class="chip-row" data-domain="cs"
                                    data-i18n="onboarding.domains.cs"></button>
                                <button type="button" class="chip-row" data-domain="physics"
                                    data-i18n="onboarding.domains.physics"></button>
                                <button type="button" class="chip-row" data-domain="biology"
                                    data-i18n="onboarding.domains.biology"></button>
                                <button type="button" class="chip-row" data-domain="hardware"
                                    data-i18n="onboarding.domains.hardware"></button>
                                <button type="button" class="chip-row" data-domain="gamedev"
                                    data-i18n="onboarding.domains.gamedev"></button>
                                <button type="button" class="chip-row" data-domain="ai"
                                    data-i18n="onboarding.domains.ai"></button>
                                <button type="button" class="chip-row" data-domain="philosophy"
                                    data-i18n="onboarding.domains.philosophy"></button>
                                <button type="button" class="chip-row" data-domain="economics"
                                    data-i18n="onboarding.domains.economics"></button>
                                <button type="button" class="chip-row" data-domain="linguistics"
                                    data-i18n="onboarding.domains.linguistics"></button>
                            </div>

                            <!-- Custom Tag Input -->
                            <div class="custom-chip-builder">
                                <input type="text" class="input input--compact" id="input-custom-chip"
                                    data-i18n-placeholder="onboarding.custom_chip_placeholder">
                                <button type="button" class="btn btn--secondary btn--compact" id="btn-add-custom-chip"
                                    data-i18n="onboarding.add_chip_btn"></button>
                            </div>

                            <div class="wizard-actions">
                                <button type="button" class="btn btn--ghost" id="btn-wizard-step1-prev"
                                    data-i18n="onboarding.btn_prev"></button>
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <span id="onboarding-step1-error" class="onboarding-inline-error" style="display: none;"
                                        data-i18n="onboarding.step1_required_error"></span>
                                    <button type="button" class="btn btn--primary btn--step-next" id="btn-wizard-step1-next"
                                        data-i18n="onboarding.btn_next"></button>
                                </div>
                            </div>
                        </div>

                        <!-- SLIDE 2: GROUNDING LEVEL VERTICAL CARDS -->
                        <div class="wizard-slide" id="wizard-slide-2" hidden>
                            <div class="slide-header">
                                <h2 class="slide-title" data-i18n="onboarding.step2_title"></h2>
                                <p class="slide-subtitle" data-i18n="onboarding.step2_subtitle"></p>
                            </div>

                            <div class="level-cards-vertical">
                                <div class="level-card-v" data-level="ground_zero">
                                    <div class="level-card-v__top">
                                        <div class="level-bolts" aria-label="Level 1 of 3">
                                            <svg class="bolt-svg filled" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                            <svg class="bolt-svg empty" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                            <svg class="bolt-svg empty" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                        </div>
                                        <span class="level-card-v__tag" data-i18n="onboarding.level_ground_zero_tag"></span>
                                    </div>
                                    <div class="level-card-v__body">
                                        <h3 class="level-card-v__title" data-i18n="onboarding.level_ground_zero_title"></h3>
                                        <p class="level-card-v__desc" data-i18n="onboarding.level_ground_zero_desc"></p>
                                    </div>
                                    <div class="level-card-v__footer">
                                        <div class="level-card-v__check" aria-hidden="true"></div>
                                    </div>
                                </div>
                                <div class="level-card-v active" data-level="builder">
                                    <div class="level-card-v__top">
                                        <div class="level-bolts" aria-label="Level 2 of 3">
                                            <svg class="bolt-svg filled" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                            <svg class="bolt-svg filled" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                            <svg class="bolt-svg empty" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                        </div>
                                        <span class="level-card-v__tag" data-i18n="onboarding.level_builder_tag"></span>
                                    </div>
                                    <div class="level-card-v__body">
                                        <h3 class="level-card-v__title" data-i18n="onboarding.level_builder_title"></h3>
                                        <p class="level-card-v__desc" data-i18n="onboarding.level_builder_desc"></p>
                                    </div>
                                    <div class="level-card-v__footer">
                                        <div class="level-card-v__check" aria-hidden="true"></div>
                                    </div>
                                </div>
                                <div class="level-card-v" data-level="deep">
                                    <div class="level-card-v__top">
                                        <div class="level-bolts" aria-label="Level 3 of 3">
                                            <svg class="bolt-svg filled" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                            <svg class="bolt-svg filled" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                            <svg class="bolt-svg filled" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                        </div>
                                        <span class="level-card-v__tag" data-i18n="onboarding.level_deep_tag"></span>
                                    </div>
                                    <div class="level-card-v__body">
                                        <h3 class="level-card-v__title" data-i18n="onboarding.level_deep_title"></h3>
                                        <p class="level-card-v__desc" data-i18n="onboarding.level_deep_desc"></p>
                                    </div>
                                    <div class="level-card-v__footer">
                                        <div class="level-card-v__check" aria-hidden="true"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="wizard-actions">
                                <button type="button" class="btn btn--ghost" id="btn-wizard-step2-prev"
                                    data-i18n="onboarding.btn_prev"></button>
                                <button type="button" class="btn btn--primary" id="btn-wizard-step2-next"
                                    data-i18n="onboarding.btn_next"></button>
                            </div>
                        </div>

                        <!-- SLIDE 3: RECENT INTRIGUES -->
                        <div class="wizard-slide" id="wizard-slide-3" hidden>
                            <div class="slide-header">
                                <h2 class="slide-title" data-i18n="onboarding.step3_title"></h2>
                                <p class="slide-subtitle" data-i18n="onboarding.step3_subtitle"></p>
                            </div>

                            <div class="slide-content-spacious">
                                <textarea class="textarea textarea--spacious-clean" id="onboarding-recent-input"
                                    data-i18n-placeholder="onboarding.recent_placeholder"></textarea>
                                <p class="step3-hint" data-i18n="onboarding.step3_hint"></p>
                            </div>

                            <div class="wizard-actions">
                                <button type="button" class="btn btn--ghost" id="btn-wizard-step3-prev"
                                    data-i18n="onboarding.btn_prev"></button>
                                <button type="button" class="btn btn--primary" id="btn-onboarding-submit">
                                    <span class="btn__text" data-i18n="onboarding.btn_submit"></span>
                                    <span class="btn__loader" aria-hidden="true"></span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            <!-- 4. COLD START (SCALED + DYNAMIC 2x2 CARDS & SLIDING SEARCH) -->
            <section class="view view--cold-start" id="view-cold-start" hidden aria-label="Cold Start">
                <div class="cold-start-wrapper">
                    <!-- Cards Grid Screen -->
                    <div class="cold-start-cards-view" id="cold-start-cards-view">
                        <span class="badge" data-i18n="cold_start.badge"></span>
                        <h1 class="page-title" data-i18n="cold_start.title"></h1>
                        <p class="page-subtitle" data-i18n="cold_start.subtitle"></p>

                        <div class="spark-grid" id="cold-start-cards-container">
                            <!-- Populated dynamically via JS -->
                        </div>

                        <div class="cold-start-actions-row">
                            <button type="button" class="btn-text-action btn-text-action--custom" id="btn-cold-start-open-custom"
                                data-i18n="cold_start.custom_thought_btn"></button>
                            <button type="button" class="btn-text-action btn-text-action--reroll" id="btn-cold-start-reroll"
                                data-i18n="cold_start.reroll_btn"></button>
                        </div>
                    </div>

                    <!-- Slide-Up Google-Style Search View -->
                    <div class="cold-start-custom-view" id="cold-start-custom-view" hidden>
                        <div class="cold-start-custom-topbar">
                            <button type="button" class="btn-back-link" id="btn-cold-start-custom-back" data-i18n="cold_start.custom_view_back"></button>
                        </div>
                        <div class="cold-start-custom-content">
                            <span class="badge" data-i18n="cold_start.badge"></span>
                            <h2 class="cold-start-custom-title" data-i18n="cold_start.custom_view_title"></h2>
                            <p class="cold-start-custom-subtitle" data-i18n="cold_start.custom_view_subtitle"></p>

                            <form id="form-cold-start-thought" class="thought-search-bar-wrap">
                                <div class="thought-search-bar">
                                    <span class="search-bar-icon" aria-hidden="true">✦</span>
                                    <input type="text" class="thought-search-input" id="input-cold-start-thought"
                                        data-i18n-placeholder="cold_start.custom_placeholder" autocomplete="off">
                                    <button type="submit" class="btn btn--primary btn--thought-submit" id="btn-submit-cold-start-thought">
                                        <span class="btn__text" data-i18n="cold_start.custom_submit"></span>
                                        <span class="btn__loader" aria-hidden="true"></span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 5. MAIN ZEN DASHBOARD (2-STAGE: DISCOVERY -> FOCUS) -->
            <section class="view view--dashboard" id="view-dashboard" hidden aria-label="Curiosity Dashboard">
                <div class="view__content dashboard-container">

                    <!-- STAGE 1: CONCEPT DISCOVERY (ASYMMETRIC SPLIT LAYOUT) -->
                    <div class="dashboard-stage dashboard-stage--discovery" id="dashboard-stage-discovery">
                        
                        <div class="discovery-split-hero">
                            
                            <!-- LEFT COLUMN (~1.3fr width, Topic Title + Domain Pill + Most Logiczny) -->
                            <div class="discovery-col discovery-col--left">
                                <div class="discovery-badge-row">
                                    <span class="domain-pill" id="discovery-concept-domain"></span>
                                </div>
                                <h1 class="discovery-hero__title" id="discovery-concept-title"></h1>
                                
                                <!-- Most Logiczny (Zaraz pod tematem po lewej stronie) -->
                                <div class="discovery-reason-box">
                                    <span class="discovery-text-label discovery-text-label--reason" data-i18n="focus_card.why_label"></span>
                                    <p class="discovery-reason-text" id="discovery-concept-reason"></p>
                                </div>
                            </div>

                            <!-- RIGHT COLUMN (Intuicja & Wprowadzenie + Przyciski akcji wyrównane do lewej krawędzi wstępu) -->
                            <div class="discovery-col discovery-col--right">
                                <div class="discovery-text-block discovery-text-block--model">
                                    <span class="discovery-text-label discovery-text-label--model" data-i18n="focus_card.model_label"></span>
                                    <p class="discovery-text-content" id="discovery-concept-model"></p>
                                </div>

                                <div class="discovery-actions">
                                    <button type="button" class="btn btn--primary btn--explore" id="btn-discovery-explore">
                                        <span class="btn__text" data-i18n="focus_card.accept_btn"></span>
                                        <svg class="btn-arrow-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                                    </button>
                                    <button type="button" class="btn btn--ghost btn--save-spark" id="btn-discovery-save-spark" data-i18n-title="focus_card.save_to_sparks_btn">
                                        <svg class="btn-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                                        <span class="btn__text" data-i18n="focus_card.save_to_sparks_btn"></span>
                                    </button>
                                </div>
                            </div>

                        </div>

                        <!-- 4 VECTOR CATEGORY SELECTOR BAR (Bottom Horizontal Bar) -->
                        <div class="vector-switcher-bar">
                            <div class="vector-pills-row" id="dashboard-vector-pills">
                                <button type="button" class="vector-pill active" data-vector="adjacent">
                                    <span class="vector-pill__icon">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="18" r="3"></circle><path d="M8.59 13.51l6.83 3.98"></path><path d="M15.41 6.51l-6.82 3.98"></path></svg>
                                    </span>
                                    <span class="vector-pill__text" data-i18n="compass.adjacent"></span>
                                </button>
                                <button type="button" class="vector-pill" data-vector="deep_dive">
                                    <span class="vector-pill__icon">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"></polyline><polyline points="7 6 12 11 17 6"></polyline></svg>
                                    </span>
                                    <span class="vector-pill__text" data-i18n="compass.deep_dive"></span>
                                </button>
                                <button type="button" class="vector-pill" data-vector="cross_domain">
                                    <span class="vector-pill__icon">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
                                    </span>
                                    <span class="vector-pill__text" data-i18n="compass.cross_domain"></span>
                                </button>
                                <button type="button" class="vector-pill" data-vector="mental_fog">
                                    <span class="vector-pill__icon">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
                                    </span>
                                    <span class="vector-pill__text" data-i18n="compass.mental_fog"></span>
                                </button>
                            </div>
                            <button type="button" class="btn-text-reroll-batch" id="btn-dashboard-reroll-batch">
                                <svg class="btn-reroll__icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                                <span class="btn-text-reroll__label" data-i18n="focus_card.reroll_batch_btn"></span>
                                <span class="btn__loader" aria-hidden="true"></span>
                            </button>
                        </div>

                    </div>

                    <!-- STAGE 2: FOCUS & ACTIVE EXPLORATION (WITH ELEVATED GRAYISH PROMPT BOX) -->
                    <div class="dashboard-stage dashboard-stage--focus" id="dashboard-stage-focus" hidden>
                        <div class="focus-hero">
                            <div class="focus-hero__topbar">
                                <button type="button" class="btn-back-link" id="btn-focus-back">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                                    <span data-i18n="focus_card.back_to_discovery_btn"></span>
                                </button>
                                <span class="badge badge--active" data-i18n="focus_card.focus_badge"></span>
                            </div>

                            <div class="focus-hero__header">
                                <span class="domain-pill" id="focus-concept-domain"></span>
                                <h1 class="focus-hero__title" id="focus-concept-title"></h1>
                            </div>

                            <!-- Context Recap: Intuicja (Model Mentalny) + Most Logiczny -->
                            <div class="focus-context-grid">
                                <div class="focus-context-card focus-context-card--model">
                                    <span class="focus-context-label" data-i18n="focus_card.model_label"></span>
                                    <p class="focus-context-text" id="focus-concept-model"></p>
                                </div>
                                <div class="focus-context-card focus-context-card--reason">
                                    <span class="focus-context-label" data-i18n="focus_card.why_label"></span>
                                    <p class="focus-context-text" id="focus-concept-reason"></p>
                                </div>
                            </div>

                            <!-- Sleek Elevated Grayish Prompt Box (No Scroll, Minimal Copy Icon Button) -->
                            <div class="prompt-card-elevated" id="prompt-card-elevated">
                                <div class="prompt-card__header">
                                    <div class="prompt-card__title-group">
                                        <span class="prompt-card__spark-icon" aria-hidden="true">✦</span>
                                        <span class="prompt-card__label" data-i18n="focus_card.prompt_box_label"></span>
                                    </div>
                                    <div class="prompt-copy-wrapper">
                                        <span class="copy-feedback-toast" id="copy-feedback-toast" data-i18n="focus_card.prompt_copied" style="display: none;"></span>
                                        <button type="button" class="btn-icon-copy" id="btn-copy-prompt" data-i18n-title="focus_card.copy_prompt_tooltip" aria-label="Copy prompt">
                                            <svg class="copy-icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="prompt-card__body">
                                    <p class="prompt-card__content" id="prompt-card-content"></p>
                                </div>
                            </div>

                            <!-- Session Actions -->
                            <div class="focus-session-actions">
                                <button type="button" class="btn btn--success btn--lg btn--finish" id="btn-focus-finish">
                                    <span class="icon">✓</span>
                                    <span class="btn__text" data-i18n="focus_card.finish_btn"></span>
                                </button>
                                <button type="button" class="btn btn--secondary btn--lg btn--spark" id="btn-focus-add-spark">
                                    <svg class="btn-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                                    <span class="btn__text" data-i18n="focus_card.add_spark_btn"></span>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- 6. KNOWLEDGE CONSTELLATION VIEW -->
            <section class="view view--constellation" id="view-constellation" hidden
                aria-label="Knowledge Constellation">
                <div class="constellation-header">
                    <div>
                        <h1 class="page-title" data-i18n="constellation.title"></h1>
                        <p class="page-subtitle" id="constellation-subtitle" data-i18n="constellation.subtitle"></p>
                    </div>
                    <button class="btn btn--ghost btn--small" id="btn-constellation-back"
                        data-i18n="constellation.back_btn"></button>
                </div>
                <div class="canvas-container">
                    <canvas id="constellation-canvas"></canvas>
                    <div class="constellation-empty" id="constellation-empty" hidden>
                        <p data-i18n="constellation.empty"></p>
                    </div>
                </div>
            </section>

            <!-- 6. HISTORY ARCHIVE VIEW -->
            <section class="view view--history" id="view-history" hidden aria-label="History Archive">
                <div class="view__content view__content--wide">
                    <div class="history-header">
                        <h1 class="page-title" data-i18n="history.title"></h1>
                        <button class="btn btn--ghost btn--small" id="btn-history-back"
                            data-i18n="history.back_btn"></button>
                    </div>
                    <div class="history-list" id="history-list"></div>
                    <p class="history-empty" id="history-empty" hidden data-i18n="history.empty"></p>
                </div>
            </section>

            <!-- 7. SETTINGS VIEW -->
            <section class="view view--settings" id="view-settings" hidden aria-label="Settings">
                <div class="view__content view__content--wide">
                    <div class="history-header">
                        <h1 class="page-title" data-i18n="settings.title"></h1>
                        <button class="btn btn--ghost btn--small" id="btn-settings-back"
                            data-i18n="settings.back_btn"></button>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-heading" data-i18n="settings.language_heading"></h3>
                        <p class="settings-hint" data-i18n="settings.language_hint"></p>
                        <select class="input" id="select-settings-language"></select>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-heading" data-i18n="settings.ai_heading"></h3>
                        <div class="settings-info" id="settings-ai-info"></div>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-heading" data-i18n="settings.privacy_heading"></h3>
                        <p class="settings-hint" data-i18n="settings.privacy_text"></p>
                    </div>
                </div>
            </section>

        </main>

        <!-- Quick Spark Modal / Drawer -->
        <div class="modal-backdrop" id="spark-modal-backdrop" hidden>
            <div class="modal-drawer">
                <div class="modal-header">
                    <h2 class="modal-title" data-i18n="spark_box.title"></h2>
                    <button class="modal-close" id="btn-close-spark-modal">&times;</button>
                </div>
                <p class="modal-subtitle" data-i18n="spark_box.subtitle"></p>
                <div class="input-group">
                    <input type="text" class="input" id="input-spark-text"
                        data-i18n-placeholder="spark_box.input_placeholder">
                    <button class="btn btn--primary" id="btn-submit-spark" data-i18n="spark_box.add_btn"></button>
                </div>
                <div class="sparks-list" id="sparks-inbox-list"></div>
            </div>
        </div>

        <!-- Multi-Concept Complete Session Modal -->
        <div class="modal-backdrop" id="complete-modal-backdrop" hidden>
            <div class="modal-card">
                <div class="modal-header">
                    <h2 class="modal-title" data-i18n="complete_modal.title"></h2>
                    <button class="modal-close" id="btn-close-complete-modal">&times;</button>
                </div>
                <p class="modal-subtitle" id="complete-modal-subtitle"></p>
                <form id="complete-session-form" class="modal-form">
                    <div class="field">
                        <label class="field__label" for="input-coexplored"
                            data-i18n="complete_modal.co_explored_label"></label>
                        <textarea class="textarea" id="input-coexplored" rows="3"
                            data-i18n-placeholder="complete_modal.co_explored_placeholder"></textarea>
                        <span class="field__hint" data-i18n="complete_modal.co_explored_hint"></span>
                    </div>
                    <div class="field">
                        <label class="field__label" for="input-notes" data-i18n="complete_modal.notes_label"></label>
                        <input type="text" class="input" id="input-notes"
                            data-i18n-placeholder="complete_modal.notes_placeholder">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn--ghost" id="btn-cancel-complete"
                            data-i18n="complete_modal.cancel_btn"></button>
                        <button type="submit" class="btn btn--primary" id="btn-confirm-complete">
                            <span class="btn__text" data-i18n="complete_modal.save_btn"></span>
                            <span class="btn__loader" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Floating Quick Spark Trigger Button (Mobile & Desktop) -->
        <button class="floating-spark-btn" id="btn-floating-spark" hidden aria-label="Złap Dygresję"
            title="Złap dygresję (Spacja)">
            <span class="icon">⚡</span>
        </button>

        <!-- Global Zen Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay" hidden aria-live="polite">
            <div class="loading-box">
                <div class="loading-spinner-orb"></div>
                <p class="loading-text" id="loading-text" data-i18n="loading.generating"></p>
            </div>
        </div>

        <!-- Notification Toast -->
        <div class="toast" id="toast" hidden role="alert">
            <span class="toast__icon">✓</span>
            <p class="toast__text" id="toast-text"></p>
        </div>
    </div>

    <script src="app.js?v=2.1"></script>
</body>

</html>
